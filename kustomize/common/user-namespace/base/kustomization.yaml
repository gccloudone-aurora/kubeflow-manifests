apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- github.com/kubeflow/manifests/common/user-namespace/base?ref=v1.10.2

patches:
- target:
    kind: Profile
    name: \$\(profile-name\)  # Escapes the special characters to target the literal string
  patch: |
    - op: replace
      path: /metadata/name
      value: kubeflow-user-example-com
    - op: replace
      path: /spec/owner/name
      value: user@example.com
